name: v8.5 offline verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-v81.txt -r requirements-report.txt
      - name: Unit and integration tests (no target traffic)
        run: python -m unittest discover -s tests -v
      - name: Python and shell syntax
        run: |
          python -m compileall -q .
          for script in *.sh; do bash -n "$script"; done
      - name: Demo imports and reports
        run: |
          python request_inventory.py import examples/demo.har examples/demo-js.jsonl --scope example.test
          python request_inventory.py import examples/v82-demo.jsonl --scope example.test
          python request_inventory.py report --xlsx
          python ai_review.py prepare --report reports/requests --scope example.test --output reports/ai-prepared
          python review_queue.py build --scope-file examples/scope.txt
          python examples/v85/demo.py --output reports/v85-demo
  browser-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Real Chromium against local fixture only
        env: {RUN_BROWSER_TESTS: '1'}
        run: python -m unittest discover -s tests -p test_browser_runtime.py -v
